<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Accès administrateur - INVISIBLES</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .login-container {
            background: #16213e;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: min(100%, 420px);
            text-align: center;
        }
        .login-container h1 { margin-bottom: 1rem; font-size: 1.8rem; }
        .login-container p { color: #c2c8d0; line-height: 1.5; }
        .login-form { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
        .login-form label { text-align: left; color: #c2c8d0; font-size: .9rem; }
        .login-form input {
            box-sizing: border-box;
            width: 100%;
            margin-top: .35rem;
            padding: 12px 15px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }
        .login-form input:focus { outline: none; border-color: #667eea; }
        .login-form button {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .login-form button:disabled { cursor: wait; opacity: .65; }
        .mode-button { background: transparent !important; border: 1px solid #667eea !important; }
        .error-message, .status-message { min-height: 1.4em; margin: .25rem 0 0; font-size: .9rem; }
        .error-message, .status-message.is-error { color: #ff8a80; }
        .status-message { color: #a5d6a7; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #c2c8d0; }
    </style>
</head>
<body>
    <main class="login-container">
        <h1>🔒 Accès administrateur</h1>
        <p id="modeDescription">L'accès aux statistiques est réservé aux comptes approuvés.</p>

        <form class="login-form" id="loginForm" novalidate>
            <label for="usernameInput">
                Nom d'utilisateur
                <input type="text" id="usernameInput" autocomplete="username" minlength="3" maxlength="32" required>
            </label>
            <label for="passwordInput">
                Mot de passe
                <input type="password" id="passwordInput" autocomplete="current-password" required>
            </label>
            <button id="submitButton" type="submit">Se connecter</button>
            <button id="modeButton" class="mode-button" type="button">Créer un nom d'utilisateur</button>
            <p id="errorMessage" class="error-message" role="alert"></p>
            <p id="statusMessage" class="status-message" role="status"></p>
        </form>
        <a class="back-link" href="./">Retour à l'accueil</a>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="site-auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
